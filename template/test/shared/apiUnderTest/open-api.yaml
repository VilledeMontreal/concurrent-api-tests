openapi: 3.0.0
info:
  title: Hello API
  version: 1.0.0
  description: A simple API that returns the authenticated user's name

components:
  schemas:
    HelloResponse:
      type: object
      properties:
        userName:
          type: string
      required:
        - userName
      additionalProperties: false
    ApiError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /hello:
    get:
      operationId: getHello
      summary: Returns the authenticated user's name
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      tags:
        - hello

servers:
  - url: "http://localhost:3000"

tags:
  - name: hello
    description: Hello operations

openapi: "3.0.1"
info:
  version: 1.0.1-beta
  title: Water Service Connections APIs
  contact:
    name: Stéphane Leblanc
    email: stephane.leblanc@montreal.ca
  description: >
    The Water Service Connections API aims to address the needs below.

    ### Short term

    - Standardized and efficient collection of information in the field by supervisors.

    - Allow the validation and approbation of information collected in the field.

    - Provide the necessary information to the finance department for billing replacements on the private side to the owners.

    - Share information about water connections internally, with contractors and with citizens.

    - Address the specific needs of the the infrastructure department; who is responsible for 60% of the replacements.

    ### Later in the road map

    - Allow the citizen to declare a replacement on the private side

    - Allow citizens to request early replacement easily (citizen involvement program)

    - etc.

  license:
    name: Copyright (c) Ville de Montréal

servers:
  - url: "http://localhost:12345/api/water/waterworks/water-service-connections"
  - url: "https://api.dev.interne.montreal.ca/api/water/waterworks/water-service-connections"
  - url: "https://api.accept.montreal.ca/api/water/waterworks/water-service-connections"
  - url: "https://api.montreal.ca/api/water/waterworks/water-service-connections"

paths:
  "/v1-beta/water-service-connections/{id}":
    get:
      operationId: getWaterServiceConnection
      description: >
        Returns the water service connection specified by id.
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Requested water service connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterServiceConnectionResponse"
        "404":
          description: Water service connection not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
    put:
      operationId: putWaterServiceConnection
      description: >
        Updates the water service connection.
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaterServiceConnectionRequest"
      responses:
        "200":
          description: Updated water service connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterServiceConnectionResponse"
        "400":
          description: Water service connection to update is not valid
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/water-service-connections/":
    post:
      operationId: postWaterServiceConnection
      description: >
        Creates the water service connection.
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaterServiceConnectionRequest"
      responses:
        "200":
          description: Created water service connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterServiceConnectionResponse"
        "400":
          description: Water service connection to create is not valid
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
    get:
      operationId: getWaterServiceConnections
      description: >
        Returns the water service connections filtered by workLocationId.
      tags:
        - Water Service Connections
      parameters:
        - name: workLocationId
          description: Work Location Id
          in: query
          schema:
            type: string
          allowEmptyValue: false
        - name: mapWorkReport
          description: Map Work Report
          in: query
          schema:
            type: boolean
          allowEmptyValue: false
      responses:
        "200":
          description: Exported water service connections in xlsx format
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "404":
          description: Work location not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/water-service-connection-synchronisations":
    post:
      operationId: postWaterServiceConnectionSynchronisations
      description: >
        Launches water service connections sychronisation between Jmap and GBeau.
        The only purpose of this endpoint is to allow for easier testing.
        The sychronisation will not be launch via this endpoint in production:
        a scheduler (kubernetes) will be used instead to launch a script.
      tags:
        - Water Service Connections
      parameters:
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          allowEmptyValue: false
        - name: batchNbr
          description: >
            The number of water service connections to get in one batch when running the
            incremental synchronization.
          in: query
          schema:
            type: integer
            format: int64
            default: 100
            maximum: 100
          required: false
      responses:
        "204":
          description: Sychronisation started
        "500":
          description: Internal sychronisation error
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/water-service-connections/{id}/history":
    get:
      operationId: getWaterServiceConnectionHistory
      description: >
        Returns the list of history records for the specified water service connection.
        Includes following items:
        <pre>
         * initial
         * visual screening
         * work reports
         * palintest screening
         * largeBuildingScreening
        </pre>
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: All water service connections history records
          content:
            application/json:
              schema:
                type: object
                title: PaginatedWaterServiceConnectionHistoryItemsResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WaterServiceConnectionHistoryItemResponse"
        "404":
          description: Water service connection not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/water-service-connections/{id}/contacts":
    get:
      operationId: getWaterServiceConnectionContacts
      description: >
        Returns the list of contacts for the specified water service connection.
        Includes following items:
        <pre>
         * owners
         * trustees
         * renters
         * occupants
         * others
        </pre>
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Water service connection contatcs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterServiceConnectionContactsResponse"
        "404":
          description: Water service connection contacts not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/deleted-water-service-connections":
    get:
      operationId: getDeletedWaterServiceConnection
      description: >
        Returns the list of deleted water service connection.
      tags:
        - Water Service Connections
      parameters:
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          allowEmptyValue: false
      responses:
        "200":
          description: All deleted water service connections
          content:
            application/json:
              schema:
                type: object
                title: PaginatedDeletedWaterServiceConnectionListResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeletedWaterServiceConnectionItemResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/allowed-report-work-location-associations":
    get:
      operationId: getAllowedWorkReportWorkLocationAssociations
      description: >
        Returns the list of work locations that contain geometrically the specified
        water service connection based on it's coordinates.
      tags:
        - Water Service Connections
      parameters:
        - $ref: "#/components/parameters/waterServiceConnectionId"
      responses:
        "200":
          description: All allowed work locations
          content:
            application/json:
              schema:
                type: object
                title: PaginatedAllowedWorkLocationItemsResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkLocationSummaryResponse"
        "404":
          description: Water service connection not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations/{id}":
    get:
      operationId: getWorkLocation
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Requested work location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLocationResponse"
        "404":
          description: Work location not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
    put:
      operationId: putWorkLocation
      description: >
        Updates the specified work location.
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLocationRequest"
      responses:
        "200":
          description: The updated work location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLocationResponse"
        "204":
          description: No content returned in dry runs to reduce DB load
        "400":
          description: Work location request is not valid
          $ref: "#/components/responses/Default"
        "404":
          description: Work location not found
          $ref: "#/components/responses/Default"
        "409":
          description: Optimistic locking failure
          $ref: "#/components/responses/Default"
        "422":
          description: Work location is not valid
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/v1-beta/dre-records":
    get:
      operationId: getDreRecords
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/q"
      description: Search DRE Records.
      responses:
        "200":
          description: Search DRE Records.
          content:
            application/json:
              schema:
                type: object
                title: PaginatedDreRecordsSearchResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DreRecordSearchResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-start-years":
    get:
      operationId: getWorkStartYears
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/q"
      description: Get Work Start Years.
      responses:
        "200":
          description: Get Work Start Years.
          content:
            application/json:
              schema:
                type: object
                title: PaginatedWorkStartYearsResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkStartYearsResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations/{id}/bid-number":
    get:
      operationId: getWorkLocationIntervention
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dreRecordNumber"
      description: Get work location bid number.
      responses:
        "200":
          description: Requested bid number.
          content:
            application/json:
              schema:
                type: object
                title: WorkLocationInterventionResponse
                properties:
                  bidNumber:
                    type: string
                  interventionNumber:
                    type: string
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations/{id}/approval-batches":
    post:
      operationId: postApprovalBatches
      tags:
        - Work Locations
      description: Changes all work report statuses in the work location - transitions old approval statuses to the new ones.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: ApprovalBatchesRequest
              required:
                - oldApprovalStatus
                - newApprovalStatus
              properties:
                oldApprovalStatus:
                  $ref: "#/components/schemas/ApprovalStatusRequest"
                newApprovalStatus:
                  $ref: "#/components/schemas/ApprovalStatusRequest"
      responses:
        "204":
          description: All matched work reports changed their statuses
        "404":
          description: Work location not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations/{id}/statistics":
    get:
      operationId: getWorkLocationStatistics
      description: >
        Returns the statistics for the work reports and water service connection associated with the given work location.
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/expand"
      responses:
        "200":
          description: Requested work location statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLocationStatisticsResponse"
        "404":
          description: Work location not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations-search/":
    get:
      operationId: getWorkLocationSearch
      description: >
        Return work location search.
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/q"
        - name: boroughs
          description: filter work location list with boroughs
          in: query
          schema:
            type: string
        - name: bidNumber
          description: filter work location list with bidNumber
          in: query
          schema:
            type: string
        - name: dreRecordNumber
          description: filter work location list with dreRecordNumber
          in: query
          schema:
            type: string
        - name: executingResponsibleService
          description: filter work location list with executingResponsibleService
          in: query
          schema:
            type: string
        - name: contractorName
          description: filter work location list with contractorName
          in: query
          schema:
            type: string
        - name: workStartYear
          description: filter work location list with workStartYear
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/orderBy"
        - $ref: "#/components/parameters/offset"
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Requested work location list
          content:
            application/json:
              schema:
                type: object
                title: PaginatedWorkLocationListResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkLocationListResponse"

  "/v1-beta/contractor-name/":
    get:
      operationId: getContractorName
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/q"
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: List contractor name.
      responses:
        "200":
          description: get list contractor name
          content:
            application/json:
              schema:
                type: object
                title: PaginatedContractorNameResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContractorNameResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/bid-number/":
    get:
      operationId: getBidNumber
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/q"
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: List bid number.
      responses:
        "200":
          description: get list bid number
          content:
            application/json:
              schema:
                type: object
                title: PaginatedBidNumberResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BidNumberResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-locations/":
    get:
      operationId: getWorkLocationList
      description: >
        Lists work location by using orderBy.
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/orderBy"
        - $ref: "#/components/parameters/offset"
        - name: dataPartitionId
          description: Testing partition Id for DEV environment
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Requested work location list
          content:
            application/json:
              schema:
                type: object
                title: PaginatedWorkLocationListResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkLocationListResponse"
    post:
      operationId: postWorkLocation
      tags:
        - Work Locations
      parameters:
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkLocationRequest"
      responses:
        "201":
          description: Created work location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLocationResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-reports/{id}":
    get:
      operationId: getWorkReport
      description: >
        Returns the work report specified by id.
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Requested work report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReportResponse"
        "404":
          description: Work report not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
    put:
      operationId: putWorkReport
      description: >
        Updates the specified work report.
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkReportRequest"
      responses:
        "200":
          description: The updated work report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReportResponse"
        "204":
          description: No content returned in dry runs to reduce DB load
        "400":
          description: Work report request is not valid
          $ref: "#/components/responses/Default"
        "404":
          description: Work report not found
          $ref: "#/components/responses/Default"
        "409":
          description: Optimistic locking failure
          $ref: "#/components/responses/Default"
        "422":
          description: Work report is not valid
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-reports/":
    post:
      operationId: postWorkReport
      description: >
        Creates a new work report.
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/dryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkReportRequest"
      responses:
        "201":
          description: The created work report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReportResponse"
        "400":
          description: Work report request is not valid
          $ref: "#/components/responses/Default"
        "422":
          description: Work report is not valid
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
    get:
      operationId: getWorkReports
      tags:
        - Work Reports
      parameters:
        - name: isDeleted
          description: perform isDeleted for a list of results
          in: query
          required: true
          schema:
            type: boolean
        - name: workReportTypeId
          description: report type (work report or citizen)
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All work reports
          content:
            application/json:
              schema:
                type: object
                title: PaginatedWorkReportSummaryListResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkReportSummaryItemResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"
  "/v1-beta/work-reports/{id}/allowed-approval-statuses":
    get:
      operationId: getAllowedApprovalStatusesFor
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
      description: Lists all possible approval statuses for the work report.
      responses:
        "200":
          description: Allowed approval statuses
          content:
            application/json:
              schema:
                type: object
                title: PaginatedApprovalStatusesResponse
                properties:
                  paging:
                    $ref: "#/components/schemas/PagingResponse"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalStatusResponse"
        "404":
          description: Work report not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-reports/{id}/update-served-addresses":
    post:
      operationId: updateServedAddresses
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
      description: update served address for workReport.
      responses:
        "200":
          description: ServedAddresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServedAddressesResponse"

        "404":
          description: Work report not found
          $ref: "#/components/responses/Default"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-reports/{id}/update-water-service-connection-copy":
    post:
      operationId: postUpdateWaterServiceConnectionCopy
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The updated work report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReportResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-reports/{id}/update-contacts":
    post:
      operationId: postUpdateContacts
      tags:
        - Work Reports
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The updated work report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReportResponse"
        default:
          description: all errors
          $ref: "#/components/responses/Default"

  "/v1-beta/work-report-imports":
    post:
      operationId: postWorkReportImport
      description: Launches a report import from a csv file
      tags:
        - Work Report imports
      requestBody:
        required: true
        content:
          application/json:

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  responses:
    Default:
      description: "Default error response."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------------------------------------
  # parameters
  # ----------------------------------------------------------------------------------------
  parameters:
    id:
      in: path
      name: id
      description: the id of the requested resource
      schema:
        type: string
      required: true
    offset:
      name: offset
      in: query
      description: "Offset of the first item in the collection"
      schema:
        type: integer
        format: int64
        default: 0
    limit:
      name: limit
      in: query
      description: "Maximum number of items in the response."
      schema:
        type: integer
        format: int64
        default: 100
        maximum: 100
    anchor:
      name: anchor
      description: the anchor of the requested comment collection
      in: query
      schema:
        type: string
      required: true
    waterServiceConnectionId:
      name: waterServiceConnectionId
      in: query
      description: Id of the water service connection
      required: true
      schema:
        type: string
      example: an-opaque-id
    validationStatusId:
      name: validationStatusId
      in: query
      description: One of the validation status id exposed in todo-later-taxonomies
      required: false
      schema:
        type: string
      example: an-opaque-id
    dreRecordNumber:
      name: dreRecordNumber
      in: query
      description: The number of the DRE record used for planning and tracking the projects.
      required: false
      schema:
        type: string
      example: 21-AAA-PTI-01
    bidNumber:
      name: bidNumber
      in: query
      description: The bid number from the supplier responsible for the works
      required: false
      schema:
        type: string
      example: T-00000
    invoicingYear:
      name: invoicingYear
      in: query
      required: false
      schema:
        type: string
      example: 2022
    usedForExistingPipe:
      name: usedForExistingPipe
      description: Show diameters for existing pipes
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    usedForNewPipe:
      name: usedForNewPipe
      description: Show diameters for new pipes
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    usedForRemainingPipe:
      name: usedForRemainingPipe
      description: Show diameters for remaining pipes
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    usedForPits:
      name: usedForPits
      description: Show diameters used for pits
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    usedForInspectionWorkReport:
      name: usedForInspectionWorkReport
      description: Show all yes no Yes No Unknown valuues
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    usedForDrinkingFountain:
      name: usedForDrinkingFountain
      description: Show all yes no Yes No Unknown values
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    dryRun:
      name: dryRun
      description: perform the operation without persisting the result
      in: query
      required: false
      schema:
        type: boolean
        default: false
    q:
      name: q
      description: search query
      in: query
      schema:
        type: string
    expand:
      name: expand
      description: expand query
      required: false
      in: query
      schema:
        type: string
    orderBy:
      name: orderBy
      description: perform orderBy for a list of results
      in: query
      required: false
      schema:
        type: string
    dataPartitionId:
      name: dataPartitionId
      description: Testing partition Id for DEV environment
      required: false
      in: query
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    isTreated:
      name: isTreated
      description: the change request is treated or no
      in: query
      required: false
      schema:
        type: boolean
    isCitizenReport:
      name: isCitizenReport
      description: indicates data is being fetched for a citizen work report
      in: query
      schema:
        type: boolean
      allowEmptyValue: true
    assignmentType:
      name: assignmentType
      description: indicates assignment type
      in: query
      required: true
      schema:
        type: string
        enum: ["1", "2"]
    locationLat:
      name: locationLat
      description: indicates locationLat
      in: query
      required: true
      schema:
        type: number
    locationLon:
      name: locationLon
      description: indicates locationLon
      in: query
      required: true
      schema:
        type: number
    nonconformityFollowUpId:
      name: nonconformityFollowUpId
      description: indicates nonconformityFollowUpId
      in: query
      required: true
      schema:
        type: string

  schemas:
    # ----------------------------------------------------------------------------------------
    # Response schemas
    # ----------------------------------------------------------------------------------------
    ErrorResponse:
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorResponse"

    ApiErrorResponse:
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorResponse"
        innererror:
          $ref: "#/components/schemas/ApiInnerErrorResponse"

    ApiInnerErrorResponse:
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        innererror:
          $ref: "#/components/schemas/ApiInnerErrorResponse"

    PagingResponse:
      type: object
      properties:
        offset:
          type: number
        limit:
          type: number
      required:
        - offset
        - limit

    PaginatedResultResponse:
      type: object
      properties:
        paging:
          type: object
          title: PaginatedResultPagingResponse
          properties:
            offset:
              type: number
            limit:
              type: number
          required:
            - offset
            - limit
        items:
          type: array
          items:
            type: object
      required:
        - paging
        - items

    ConnectivityTestResponse:
      required:
        - id
        - createdAt
        - tests
      properties:
        id:
          type: string
          description: connectivity test id
        createdAt:
          $ref: "#/components/schemas/UtcIsoString"
        tests:
          type: array
          items:
            type: object
            title: ConnectivityTestTestsResponse
            required:
              - title
            properties:
              title:
                type: string

    ApprovalStatusResponse:
      description: A dictionnary of approval statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    ReturnReasonResponse:
      description: A dictionnary of return reason with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    WorkReportHistoryResponse:
      type: object
      properties:
        previousApprovalStatus:
          $ref: "#/components/schemas/ApprovalStatusResponse"
        newApprovalStatus:
          $ref: "#/components/schemas/ApprovalStatusResponse"
        returnSection:
          type: object
          nullable: true
          properties:
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/ReturnReasonResponse"
            precision:
              type: string
              nullable: true
        createdAt:
          $ref: "#/components/schemas/UtcIsoString"
        createdBy:
          $ref: "#/components/schemas/UserSummaryResponse"

    ApprovalStageResponse:
      description: A dictionnary of approval statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    MaterialStatusResponse:
      description: A dictionnary of material statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    WorkReportStatusResponse:
      description: A dictionnary of work report statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    WaterServiceConnectionLeadStatusResponse:
      description: A dictionnary of water service connection lead statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    WaterServiceConnectionLeadStatusOptionalResponse:
      description: A dictionnary of water service connection lead statuses with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    InitialLeadStatusResponse:
      description: A dictionnary of initial lead statuses with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    ServedAddressesResponse:
      type: object
      allOf:
        - $ref: "#/components/schemas/ServedAddressesRequest"
      properties:
        humanReadableAddress:
          type: string
          default: ""
        flagForCorrection:
          $ref: "#/components/schemas/FlagResponse"
        correction:
          $ref: "#/components/schemas/CorrectionResponse"
        byDefault:
          $ref: "#/components/schemas/ServedAddressBaseResponse"
        taxStatus:
          $ref: "#/components/schemas/TaxStatusResponse"
        tefInvoicingStatus:
          $ref: "#/components/schemas/TefInvoicingStatusResponse"
      required:
        - humanReadableAddress
        - useCorrection
        - byDefault
        - taxStatus

    CorrectionResponse:
      type: object
      required:
        - borough
        - fullStreetName
        - fromHouseNumber
        - toHouseNumber
        - apartmentNumber
        - realEstateTaxAccounts
      allOf:
        - $ref: "#/components/schemas/CorrectionRequest"
        - $ref: "#/components/schemas/ServedAddressBaseResponse"

    ServedAddressBaseResponse:
      type: object
      required:
        - borough
        - realEstateTaxAccounts
      properties:
        borough:
          $ref: "#/components/schemas/BoroughResponse"
        realEstateTaxAccounts:
          type: array
          items:
            $ref: "#/components/schemas/RealEstateTaxAccountResponse"

    PipeDiameterResponse:
      description: A dictionnary of pipe diameters with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"
        - type: object
          title: PipePopularDiameterResponse
          nullable: true
          required:
            - isPopularDiameter
            - diameterInInch
          properties:
            isPopularDiameter:
              type: boolean
            diameterInInch:
              type: string
              nullable: true

    PipeMaterialResponse:
      description: A dictionnary of pipe materials with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    PitLocationResponse:
      description: A dictionnary of pit locations with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    AscertainmentLocationResponse:
      description: A dictionnary of ascertainment locations with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    ReplacementLimitResponse:
      description: A dictionnary of replacement limits with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    BillablePrivateReplacementResponse:
      description: A dictionnary of billable private replacement with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    ReferencePeriodForInvoicingStatusSummaryResponse:
      description: A dictionnary of reference period for invoicing with only extractionOfInvoiceRequests status  and id as the key.
      type: object
      required:
        - year
        - extractionOfInvoiceRequests
      properties:
        year:
          type: string
        extractionOfInvoiceRequests:
          type: object
          required:
            - status
          properties:
            status:
              $ref: "#/components/schemas/ExtractionOfTaxAccountInvoiceRequestStatusResponse"

    ReferencePeriodForInvoicingResponse:
      description: A dictionnary of reference period for invoicing with id as the key.
      type: object
      required:
        - id
        - extractionOfTaxAccountInvoiceRequests
        - sumOfPrivateReplacementCostWithoutTaxesInCanadianCents
        - taxRate
        - sumOfSpecialCostWithoutTaxesInCanadianCents
        - sumOfBillableLengthInCm
        - netCostPerLinearMeterInCanadianCents
        - lastModifiedAt
        - lastModifiedBy
      properties:
        id:
          type: string
        extractionOfTaxAccountInvoiceRequests:
          $ref: "#/components/schemas/ExtractionOfTaxAccountInvoiceRequestsResponse"
        sumOfPrivateReplacementCostWithoutTaxesInCanadianCents:
          type: number
        taxRate:
          type: number
        sumOfSpecialCostWithoutTaxesInCanadianCents:
          type: number
        sumOfBillableLengthInCm:
          type: number
        netCostPerLinearMeterInCanadianCents:
          type: number
        hasWorkReportChangeRequest:
          type: boolean
          default: false
        lastModifiedAt:
          $ref: "#/components/schemas/UtcIsoString"
        lastModifiedBy:
          $ref: "#/components/schemas/UserSummaryResponse"
        files:
          type: array
          items:
            $ref: "#/components/schemas/StorageObjectResponse"

    ExtractionOfTaxAccountInvoiceRequestsResponse:
      description: Extraction Of Invoice Requests Response
      type: object
      required:
        - status
        - lastModifiedAt
        - lastModifiedBy
      properties:
        status:
          $ref: "#/components/schemas/ExtractionOfTaxAccountInvoiceRequestStatusResponse"
        lastModifiedAt:
          $ref: "#/components/schemas/UtcIsoString"
        lastModifiedBy:
          $ref: "#/components/schemas/UserSummaryResponse"
        file:
          $ref: "#/components/schemas/StorageObjectResponse"

    ReferencePeriodForInvoicingIdResponse:
      description: A dictionnary of reference period for invoicing with id as the key.
      type: object
      required:
        - id
      properties:
        id:
          type: string

    ReferencePeriodForInvoicingSummaryResponse:
      description: A dictionnary of reference period for invoicing with id as the key.
      type: object
      required:
        - id
        - extractionOfTaxAccountInvoiceRequests
        - netCostPerLinearMeterInCanadianCents
      properties:
        id:
          type: string
        extractionOfTaxAccountInvoiceRequests:
          type: object
          title: ReferencePeriodForInvoicingSummaryExtractionOfTaxAccountInvoiceRequestsResponse
          required:
            - status
          properties:
            status:
              $ref: "#/components/schemas/ExtractionOfTaxAccountInvoiceRequestStatusResponse"
        netCostPerLinearMeterInCanadianCents:
          type: number
        hasWorkReportChangeRequest:
          type: boolean
          default: false

    ExtractionOfTaxAccountInvoiceRequestStatusResponse:
      description: A dictionnary of Extraction Of TaxAccountInvoiceRequest Status  with id as the key.
      type: object
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    ReplacementProcessResponse:
      description: A dictionnary of replacement processes with id as the key.
      type: object
      nullable: true
      allOf:
        - $ref: "#/components/schemas/NamedEntityResponse"

    SupervisorResponse:
      type: object
      required:
        - userExists
      properties:
        userExists:
          type: boolean

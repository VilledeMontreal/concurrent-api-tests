    # ----------------------------------------------------------------------------------------
    # Primitive types
    # ----------------------------------------------------------------------------------------
    UtcIsoString:
      type: string
      pattern: '^$|^\d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d\.\d{3}Z$'
      example: "2017-09-26T17:20:30.000Z"

    UtcIsoStringNullable:
      type: string
      pattern: '^$|^\d{4}-[01]\d-[0-3]\dT[0-2]\d:[0-5]\d:[0-5]\d\.\d{3}Z$'
      example: "2017-09-26T17:20:30.000Z"
      nullable: true

    CalendarDay:
      type: string
      pattern: '^$|^\d{4}-[01]\d-[0-3]\d'
      example: "2017-09-26"

    CalendarDayNullable:
      type: string
      pattern: '^$|^\d{4}-[01]\d-[0-3]\d'
      example: "2017-09-26"
      nullable: true

    HistoryItemType:
      type: string
      enum:
        [
          workReport,
          palintestScreening,
          visualScreening,
          largeBuildingScreening,
          initial,
          inspectionReport,
          assignment,
          nonconformityFollowUp,
          regulatoryAnalysis,
        ]

    ReceiveWaterFromKindType:
      type: string
      enum: [waterServiceConnection, waterwork]

    GeometryType:
      type: string
      enum:
        - Point
        - LineString
        - Polygon
        - MultiPoint
        - MultiLineString
        - MultiPolygon
      description: the geometry type

    Position:
      description: >
        GeoJSon fundamental geometry construct.
      externalDocs:
        url: "https://tools.ietf.org/html/rfc7946#section-3.1.1"
      type: array
      minItems: 2
      maxItems: 3
      items:
        type: number

    DrinkingFountainWorkReportDetailsKindType:
      type: string
      enum: [replacement, filterInstallation, ""]

    DrinkingFountainScreeningType:
      type: string
      enum: [rdt, stagnation, ""]

    DrinkingFountainHistoryKindType:
      type: string
      enum: [drinkingFountainScreeningReport, drinkingFountainWorkReport]
